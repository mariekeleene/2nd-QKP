<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🏚️ QKP - Jelsa Stills</title>

    <link rel="stylesheet" href="slideshow.css">
</head>

<body>

<header class="top-bar">
    <span id="details-btn" class="details">more information ▽</span>
</header>


<section id="details-text" class="details-text">
    <div class="details-content">

        <div class="details-left">
            <p><b>Title:</b> Jelsa Stills</p>
            <p><b>Year:</b> 2024</p>
            <p><b>Medium:</b> video/animation/3D scanning</p>
        </div>

        <div class="details-right">
            <p>
                A series of small loops made in Jelsa - Croatia
                during a 4 month residency.
            </p>
        </div>

    </div>
</section>


<a href="index.html" aria-label="Back to home">
    <img src="images/back.png" id="floating-back" alt="Back">
</a>


<main class="feed-wrapper">
    <div id="feed" class="feed"></div>
</main>


<script>
    document.addEventListener("DOMContentLoaded", () => {

        const media = [
            "images/TROPHEES.mov",
            "images/SHOPPING.mov",
            "images/Screenshot 2024-07-09 at 23.23.09.png",
            "images/LAMP.mov"
        ];

        const feed = document.getElementById("feed");
        const detailsBtn = document.getElementById("details-btn");
        const detailsText = document.getElementById("details-text");
        const button = document.getElementById("floating-back");


        /* -----------------------------
           DETAILS TOGGLE
        ----------------------------- */

        detailsBtn.addEventListener("click", () => {

            detailsText.classList.toggle("active");

            detailsBtn.textContent =
                detailsText.classList.contains("active")
                    ? "close ▲"
                    : "more information ▽";

        });


        /* -----------------------------
           ADD MEDIA
        ----------------------------- */

        function addMedia() {

            media.forEach(src => {

                const extension = src
                    .split(".")
                    .pop()
                    .toLowerCase();

                if (["mp4", "mov", "webm", "ogg"].includes(extension)) {

                    const video = document.createElement("video");

                    video.src = src;
                    video.autoplay = true;
                    video.loop = true;
                    video.muted = true;
                    video.playsInline = true;
                    video.controls = false;

                    // Helps the browser display the first frame immediately
                    video.preload = "metadata";

                    feed.appendChild(video);

                } else {

                    const img = document.createElement("img");

                    img.src = src;
                    img.loading = "lazy";
                    img.alt = "";

                    feed.appendChild(img);
                }
            });
        }


        /* -----------------------------
           INITIAL LOAD
        ----------------------------- */

        addMedia();


        /* -----------------------------
           INFINITE SCROLL
        ----------------------------- */

        let loading = false;

        window.addEventListener("scroll", () => {

            if (loading) return;

            const nearBottom =
                window.innerHeight + window.scrollY >=
                document.body.offsetHeight - 500;

            if (nearBottom) {

                loading = true;

                addMedia();

                // Prevent adding multiple batches
                // during the same scroll event.
                setTimeout(() => {
                    loading = false;
                }, 300);
            }
        });


        /* -----------------------------
           FLOATING BACK BUTTON
        ----------------------------- */

        function moveButton() {

            const buttonWidth = button.offsetWidth;
            const buttonHeight = button.offsetHeight;

            const maxX = Math.max(
                10,
                window.innerWidth - buttonWidth - 10
            );

            const maxY = Math.max(
                10,
                window.innerHeight - buttonHeight - 10
            );

            const x = 10 + Math.random() * (maxX - 10);
            const y = 10 + Math.random() * (maxY - 10);

            button.style.left = `${x}px`;
            button.style.top = `${y}px`;
        }


        moveButton();

        setInterval(moveButton, 8000);

        // Recalculate if phone is rotated/resized
        window.addEventListener("resize", moveButton);

    });
</script>

</body>
</html>
