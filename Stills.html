<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jelsa Stills️</title>

    <link rel="stylesheet" href="slideshow.css">
</head>

<body>

<header class="top-bar">
    <!--    <span class="product-title">Fountain for golfers &#45;&#45; </span>-->
    <span id="details-btn" class="details">MORE INFO ▽ </span>
</header>


<section id="details-text" class="details-text">
    <div class="details-content">
        <div class="details-left">
            <p><b>Title:</b> Jelsa Stills</p>
            <p><b>Year:</b> 2024</p>
            <p><b>Medium:</b> video/animation/3D scanning</p>
            <!--            <p>Collaborators: Perry Duarte</p>-->
<!--            <p><b>Showed at:</b> Aqua Invísivel, Lagos and Pop up event: The Museum of Contemporary art of Tuvalu, Agueda</p>-->

        </div>
        <div class="details-right">
            <p>
                A series of small loops made in Jelsa- Croatia during a 4 month residency.
            </p>
        </div>
    </div>
</section>

<a href="index.html">
    <img src="images/back.png" id="floating-back">
</a>

<main class="feed-wrapper">
    <div id="feed" class="feed"></div>
</main>

<!--<div class="floating-images">-->
<!--    <img src="images/1.jpg" class="img img1">-->
<!--    <img src="images/2.jpg" class="img img2">-->

<!--    <img src="images/4.jpg" class="img img4">-->
<!--    <img src="images/5.jpg" class="img img5">-->
<!--</div>-->

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const images = [
            "images/TROPHEES.mov",
            "images/SHOPPING CART.mov",
            "images/Screenshot 2024-07-09 at 23.23.09.png",
            "images/LAMP.mov"
        ];

        const feed = document.getElementById("feed");
        const detailsBtn = document.getElementById("details-btn");
        const detailsText = document.getElementById("details-text");

        /* DETAILS TOGGLE */
        detailsBtn.addEventListener("click", () => {

            detailsText.classList.toggle("active");

            detailsBtn.textContent = detailsText.classList.contains("active")
                ? "CLOSE ▲"
                : "MORE INFO ▽";

        });

        /* ADD IMAGES */
        function addImages() {
            images.forEach(src => {
                const img = document.createElement("img");
                img.src = src;
                img.loading = "lazy";
                feed.appendChild(img);
            });
        }

        /* INIT */
        addImages();
        addImages();

        /* INFINITE SCROLL */
        window.addEventListener("scroll", () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
                addImages();
            }
        });

        const button = document.getElementById("floating-back");

        function moveButton() {

            const w = window.innerWidth - button.offsetWidth;
            const h = window.innerHeight - button.offsetHeight;

            const x = Math.random() * w;
            const y = Math.random() * h;

            button.style.left = x + "px";
            button.style.top = y + "px";
        }

        /* move every 2 seconds */

        moveButton();
        setInterval(moveButton, 8000);

    });
</script>
</body>
</html>
