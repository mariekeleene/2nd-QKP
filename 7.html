<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>🏚️ QKP - 7 Trees️</title>

    <link rel="stylesheet" href="slideshow.css">
</head>

<body>

<header class="top-bar">
    <!--    <span class="product-title">Fountain for golfers &#45;&#45; </span>-->
    <span id="details-btn" class="details">more information ▽ </span>
</header>


<section id="details-text" class="details-text">
    <div class="details-content">
        <div class="details-left">
            <p><b>Title:</b>7 Trees</p>
            <p><b>Year:</b> 2023</p>
            <p><b>Medium:</b> Multimedia installation</p>
            <!--            <p>Collaborators: Perry Duarte</p>-->
            <p><b>Showed at:</b> Casianno, Lisbon</p>

        </div>
        <div class="details-right">
            <p>
                7 short loops representing trees around the world
                and the state they are currently in.            </p>
        </div>
    </div>
</section>

<a href="index.html">
    <img src="images/back.png" id="floating-back">
</a>

<main class="feed-wrapper">
    <div id="feed" class="feed"></div>
</main>

<!--<div class="floating-images">-->
<!--    <img src="images/1.jpg" class="img img1">-->

<script>
    document.addEventListener("DOMContentLoaded", () => {

        const images = [
            "images/photo_2025-08-07 12.55.06.jpeg",
            "images/IMG_1687.jpeg",
            "images/IMG_1689.jpeg",
            "images/IMG_1698.jpeg",
            "images/IMG_1702.jpeg",
            "images/IMG_1716.jpeg",
            "images/IMG_1719.jpeg",
            "images/IMG_1723.jpeg",
            "images/IMG_1747.jpeg",
            "images/IMG_1750.jpeg",
            "images/IMG_1751.jpeg",
            "images/IMG_1723.jpeg",
            "images/IMG_2048.jpeg",
            "images/IMG_2054.jpeg",
            "images/IMG_2057.jpeg",
            "images/IMG_2059.jpeg",
            "images/IMG_2065.jpeg",
            "images/IMG_2066.jpeg",
            "images/IMG_2067.jpeg",
            "images/IMG_2048.jpeg"
        ];

        const feed = document.getElementById("feed");
        const detailsBtn = document.getElementById("details-btn");
        const detailsText = document.getElementById("details-text");

        /* DETAILS TOGGLE */
        detailsBtn.addEventListener("click", () => {

            detailsText.classList.toggle("active");

            detailsBtn.textContent = detailsText.classList.contains("active")
                ? "close ▲"
                : "more information ▽";

        });

        /* ADD IMAGES */
        function addImages() {
            images.forEach(src => {
                const img = document.createElement("img");
                img.src = src;
                img.loading = "lazy";
                feed.appendChild(img);
            });
        }

        /* INIT */
        addImages();
        addImages();

        /* INFINITE SCROLL */
        window.addEventListener("scroll", () => {
            if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
                addImages();
            }
        });

        const button = document.getElementById("floating-back");

        function moveButton() {

            const w = window.innerWidth - button.offsetWidth;
            const h = window.innerHeight - button.offsetHeight;

            const x = Math.random() * w;
            const y = Math.random() * h;

            button.style.left = x + "px";
            button.style.top = y + "px";
        }

        /* move every 2 seconds */

        moveButton();
        setInterval(moveButton, 8000);

    });
</script>
</body>
</html>
